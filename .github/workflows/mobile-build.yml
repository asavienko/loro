name: Mobile build

on:
  pull_request:
    paths: ['apps/mobile/**', 'packages/**']
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, staging, production]
        default: preview

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

# NOTE: `preview` builds are posted to the PR as a QR code. For anything visual,
# audio, or animated, a reviewer is expected to install it — a screenshot cannot
# show whether the warming card stutters. See docs/process/code-review.md
jobs:
  configuration:
    name: EAS configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check project and credentials without starting a build
        id: config
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MANUAL_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          pnpm --filter @loro/mobile exec expo config --type public --json > /tmp/loro-expo-config.json
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/loro-expo-config.json', 'utf8'));
          const id = config.extra?.eas?.projectId;
          const enabled = Boolean(process.env.EXPO_TOKEN && id && id !== 'PLACEHOLDER');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          if (!enabled) {
            console.log('EAS is not configured: set a real project ID and EXPO_TOKEN (plan 58). Browser and bundle gates run in CI.');
            if (process.env.MANUAL_BUILD === 'true') process.exit(1);
          }
          NODE

  build:
    name: EAS ${{ inputs.profile || 'preview' }}
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: ${{ (inputs.profile == 'production') && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: packages/core-rs }
      - run: cargo install cargo-ndk --locked
      # This job feeds EAS the native targets; nothing here loads the WASM, so skip it
      # rather than spend a wasm-pack install on it. Declared, not silently absent.
      - run: pnpm core-rs:build
        env: { LORO_SKIP_WASM: '1' }
      - run: pnpm tokens:build

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: eas build --non-interactive --no-wait --platform all --profile ${{ inputs.profile || 'preview' }}

      - name: Comment the install link on the PR
        if: github.event_name == 'pull_request'
        run: eas build:list --limit 1 --json --non-interactive > build.json
        # A follow-up step posts the QR code; omitted here to keep the scaffold honest
        # about what has and hasn't been wired up.

  # ─────────────────────────────────────────────────────────────
  # Device farm — only on main, because it's slow and costs money.
  # All p95 budgets are measured on the DEVICE FLOOR, not flagships.
  # See docs/process/qa-device-matrix.md
  # ─────────────────────────────────────────────────────────────
  device-farm:
    name: device farm (E2E + startup)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Maestro E2E on the device matrix
        run: echo "TODO(M0) — wire up the device farm — see docs/process/ci-cd.md"
      - name: Startup trace vs budget (iPhone SE 3, Pixel 6a)
        run: echo "TODO(M0) — cold start p95 <= 1.8s, survival mode <= 2.0s"
