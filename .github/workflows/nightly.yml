  offline-sim:
    name: 30-day offline replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Simulated clock advance, then sync. Asserts convergence and no data loss.
      - run: echo "TODO(M2) — pnpm --filter api test:sync-replay"

  scheduler-sim:
    name: 365-day scheduler simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: packages/core-rs }
      # Catches DESIGN errors, not code errors: e.g. a scheduling tweak that
      # quietly creates a review wall in month four.
      - run: cd packages/core-rs && cargo test --release --test sim -- --nocapture

  load-test:
    name: load test at 10x projected peak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
