name: _deploy

# Reusable deploy. Expand → migrate → contract, then blue-green with a health gate.
# Migrations run as a SEPARATE step before cutover, so a deploy is never coupled
# to a client release. See docs/architecture/data-model.md#server-rules

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
