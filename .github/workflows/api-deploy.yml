name: API deploy

on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/core/**', 'packages/core-rs/**']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, production]
        default: dev

concurrency:
  group: api-deploy-${{ inputs.environment || 'pipeline' }}
  cancel-in-progress: false

jobs:
  image:
    name: build image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ vars.REGISTRY }}/loro-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the built artifact for secrets
        run: echo "TODO(M0) — secret scan of the image, not just the source"

  dev:
    needs: image
    if: github.event_name == 'push' || inputs.environment == 'dev'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      tag: ${{ needs.image.outputs.tag }}
    secrets: inherit

  staging:
    needs: [image, dev]
    if: github.event_name == 'push' || inputs.environment == 'staging'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      tag: ${{ needs.image.outputs.tag }}
    secrets: inherit

  # Production requires an environment approval. See docs/process/environments.md
  production:
    needs: [image, staging]
    if: inputs.environment == 'production'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      tag: ${{ needs.image.outputs.tag }}
    secrets: inherit
