name: Feature / task
description: Work to be done
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Before this can be picked up it needs to meet the
        [definition of ready](../../docs/process/definition-of-done.md#definition-of-ready--before-work-starts).

  - type: input
    id: requirements
    attributes:
      label: Requirement IDs
      description: From docs/product/prd.md — e.g. P2-04, LB-25
      placeholder: P2-04
    validations: { required: true }

  - type: input
    id: blueprint
    attributes:
      label: Blueprint reference
      description: Line range in Loro.dc.html, or "new design"
      placeholder: Loro.dc.html:1404–1538

  - type: textarea
    id: what
    attributes:
      label: What and why
    validations: { required: true }

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behaviour, testable.
      placeholder: |
        - [ ] …
        - [ ] …
    validations: { required: true }

  - type: textarea
    id: edges
    attributes:
      label: Edge cases
      description: >
        docs/product/functional-spec.md usually already lists them for the screen — copy them here.
    validations: { required: true }

  - type: textarea
    id: design
    attributes:
      label: Tokens and components
      description: Existing ones to use, or new ones needed (which means design involvement).

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: More than two days means it should be split.
      options: ['< 1 day', '1–2 days', 'needs splitting']
    validations: { required: true }

  - type: checkboxes
    id: considerations
    attributes:
      label: Does this touch any of these?
      options:
        - label: Recorded audio, or anything derived from it
        - label: A number displayed to the learner
        - label: Copy on any surface (including widgets and notifications)
        - label: A syncable field
        - label: The scheduler or scoring in loro-core
        - label: Offline behaviour
