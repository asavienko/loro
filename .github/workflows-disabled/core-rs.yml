name: core-rs

on:
  pull_request:
    paths:
      - 'packages/core-rs/**'
      - '.github/workflows/core-rs.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-rs/**'

concurrency:
  group: core-rs-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/core-rs

jobs:
  test:
    name: unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: packages/core-rs }

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      - name: Unit + integration tests
        run: cargo test --all-features

      # Plan 77 has not landed the golden harness yet. All existing tests run above;
      # enable the dedicated suite automatically when its Cargo test target exists.
      - name: Golden DSP tests
        id: golden
        if: hashFiles('packages/core-rs/tests/golden.rs', 'packages/core-rs/tests/golden/main.rs') != ''
        run: cargo test --test golden -- --nocapture

      - name: Explain the golden failure
        if: failure() && steps.golden.outcome == 'failure'
        run: |
          echo "::error::A golden DSP score moved beyond its stability threshold."
          echo "This is either a real improvement or a regression. Do NOT re-baseline silently —"
          echo "explain the change in the PR description. See docs/process/code-review.md#special-review-paths"

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: packages/core-rs }
      - name: Criterion benchmarks
        run: cargo bench -- --save-baseline pr
      - uses: actions/upload-artifact@v7
        with:
          name: criterion
          path: packages/core-rs/target/criterion/

  build-matrix:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-ios, os: macos-latest }
          - { target: aarch64-apple-ios-sim, os: macos-latest }
          - { target: aarch64-linux-android, abi: arm64-v8a, os: ubuntu-latest }
          - { target: armv7-linux-androideabi, abi: armeabi-v7a, os: ubuntu-latest }
          - { target: x86_64-linux-android, abi: x86_64, os: ubuntu-latest }
          - { target: wasm32-unknown-unknown, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: packages/core-rs, key: '${{ matrix.target }}' }

      - name: Install cargo-ndk
        if: contains(matrix.target, 'android')
        run: cargo install cargo-ndk --locked

      - name: Android library with the NDK linker
        if: contains(matrix.target, 'android')
        run: cargo ndk --target ${{ matrix.abi }} build --release --lib

      - name: iOS or WASM library
        if: ${{ !contains(matrix.target, 'android') }}
        run: cargo build --release --lib --target ${{ matrix.target }}

  parity:
    name: calendar parity
    runs-on: macos-latest
    needs: build-matrix
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: packages/core-rs }
      # The current parity target exercises calendar fixtures; native binding parity is
      # still owned by plan 60. Do not claim it from this Rust-only harness.
      - name: Calendar parity fixtures
        run: cargo test --test parity
