[package]
name = "loro-core"
version = "0.1.0"
edition = "2021"
# uniffi 0.32 pulls askama 0.16 (1.88), cargo_metadata 0.23 (1.86) and toml 1.1 (1.85)
# through uniffi_bindgen. CI builds on stable, so nothing here catches a stale floor —
# it only breaks for whoever is pinned to the old one.
rust-version = "1.88"
description = "Every number in Loro that must be identical on iOS, Android, and the server."
license = "UNLICENSED"
publish = false

[lib]
name = "loro_core"
# staticlib → iOS · cdylib → Android + WASM · rlib → tests and benches
crate-type = ["staticlib", "cdylib", "rlib"]
# Only core_benches is a benchmark. Without this, `cargo bench` also builds the lib and the
# bindgen bin as bench targets, and their libtest harnesses reject Criterion's own flags:
# `cargo bench -- --warm-up-time 1` dies on "Unrecognized option: 'warm-up-time'" before a
# single benchmark runs. Both CI bench invocations pass such flags.
bench = false

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
bench = false

[dependencies]
uniffi = { version = "0.32" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android")))'.dependencies]
uniffi = { version = "0.32", features = ["cli"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
insta = { version = "1", features = ["json"] }

[[bench]]
name = "core_benches"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# No `panic = "abort"` here, deliberately, for two reasons.
#
# It breaks `cargo bench`. The `bench` profile inherits `release`, and Cargo then builds the
# lib twice under one filename — once as a deliverable (abort) and once as a dependency of a
# bench harness, which must unwind. That is "output filename collision at
# target/release/deps/libloro_core.rlib" (rust-lang/cargo#6313); whichever build loses the
# clobber leaves the other linking against the wrong strategy and the compile fails with
# "the crate `loro_core` requires panic strategy `abort` which is incompatible with this
# crate's strategy of `unwind`". It failed on CI's Linux runner and passed on macOS, because
# the clobber order decides, not the platform.
#
# It also defeats UniFFI. The generated scaffolding wraps every call in
# `panic::catch_unwind` (uniffi_core/src/ffi/rustcalls.rs) to turn a Rust panic into an
# error the Swift and Kotlin sides can handle. Under `abort` that catch is dead code and any
# panic in loro-core takes the learner's whole app down instead.

# Golden DSP tests and the 365-day simulation are slow in debug.
[profile.test]
opt-level = 2
