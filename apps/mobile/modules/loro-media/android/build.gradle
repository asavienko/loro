plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.loro'
version = '0.1.0'

android {
  namespace 'expo.modules.loromedia'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

repositories {
  mavenCentral()
}

dependencies {
  // The media3 expo-audio already brings, so the app carries one copy.
  def media3Version = '1.8.0'
  implementation "androidx.media3:media3-common:$media3Version"
  implementation "androidx.media3:media3-session:$media3Version"
  // @OptIn for media3's unstable APIs (SimpleBasePlayer, the notification provider).
  implementation 'androidx.annotation:annotation-experimental:1.4.1'
}
