name: loro-local
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    env_file:
      - path: apps/api/.env
        format: raw
    environment:
      PORT: '3000'
      DATABASE_URL: postgres://loro:loro@postgres:5432/loro
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    command:
      [
        'pnpm',
        '--filter',
        '@loro/mobile',
        'exec',
        'expo',
        'start',
        '--web',
        '--host',
        'lan',
        '--port',
        '8081',
      ]
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:3000/v1
      EXPO_PUBLIC_CDN_URL: http://localhost:9000/loro-content
      EXPO_NO_TELEMETRY: '1'
    ports: ['127.0.0.1:8081:8081']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      start_period: 90s
      retries: 12
  postgres:
    extends:
      file: apps/api/docker-compose.yml
      service: postgres
  redis:
    extends:
      file: apps/api/docker-compose.yml
      service: redis
    profiles: [infra]
  minio:
    extends:
      file: apps/api/docker-compose.yml
      service: minio
    profiles: [infra]
  minio-init:
    extends:
      file: apps/api/docker-compose.yml
      service: minio-init
    profiles: [infra]
volumes:
  pgdata:
  redisdata:
  miniodata:
