<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
<title>Sign in &amp; sync - Loro</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          terracotta: {
            50: '#FDF7F4',
            100: '#F9EBE5',
            500: '#C85A32',
            600: '#B04B26',
            700: '#8E3A1A',
          },
          parchment: {
            50: '#FCFBF8',
            100: '#F7F4EC',
            200: '#EFE9DE',
            300: '#E3DCce',
          },
          espresso: {
            900: '#231E18',
            800: '#3A3229',
            700: '#52483C',
            500: '#7F7261',
            400: '#A49683',
          }
        },
        fontFamily: {
          serif: ['Newsreader', 'Georgia', 'serif'],
          sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  body {
    background-color: #ECE7DE;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #231E18;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .app-frame {
    width: 390px;
    height: 844px;
    background: #FCFBF8;
    box-shadow: 0 25px 50px -12px rgba(35, 30, 24, 0.15), 0 0 0 1px rgba(35, 30, 24, 0.05);
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
</style>
</head>
<body>
<div class="app-frame">
<!-- Top Dynamic Island & Status Bar Safe Area -->
<div class="pt-3 px-7 flex justify-between items-center text-xs font-semibold tracking-tight text-espresso-800 z-20">
<span>9:41</span>
<div class="w-28 h-4 bg-espresso-900 rounded-full mx-auto"></div>
<div class="flex items-center gap-1.5">
<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.58 10.56 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9z"></path></svg>
<div class="w-5 h-2.5 border border-espresso-800 rounded-sm p-0.5 flex items-center">
<div class="h-full w-3 bg-espresso-800 rounded-2xs"></div>
</div>
</div>
</div>
<!-- App Header / Sheet Nav -->
<div class="px-6 pt-4 pb-3 border-b border-parchment-200 flex items-center justify-between"><button class="text-terracotta-600 hover:text-terracotta-700 text-sm font-semibold tracking-tight flex items-center gap-1 transition-colors">
<span>Today</span>
</button>
<div class="flex items-center gap-1.5">
<span class="font-serif text-lg font-semibold tracking-tight text-espresso-900">Sign in &amp; sync</span>
</div>
<div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-parchment-100 border border-parchment-300 text-xs font-medium text-espresso-700">
<span class="w-1.5 h-1.5 rounded-full bg-amber-600"></span>
<span>Offline mode</span>
</div></div>
<!-- Content Body -->
<div class="flex-1 px-6 pt-6 pb-8 flex flex-col justify-between overflow-y-auto"><div class="flex flex-col items-center text-center">
<!-- Centered illustration badge: Loro emblem with offline cloud indicator -->
<div class="relative w-28 h-28 my-2 flex items-center justify-center">
<div class="absolute inset-0 rounded-full border-2 border-dashed border-terracotta-500/30"></div>
<div class="w-20 h-20 rounded-2xl bg-parchment-100 border border-parchment-200 shadow-sm flex items-center justify-center">
<svg fill="none" height="34" viewBox="0 0 32 32" width="34" xmlns="http://www.w3.org/2000/svg">
<path d="M6 18C6 11.3726 11.3726 6 18 6H26V14C26 20.6274 20.6274 26 14 26H6V18Z" fill="#C85A32"></path>
<circle cx="18" cy="14" fill="#FCFBF8" r="3"></circle>
<path d="M6 26C6 22.6863 8.68629 20 12 20H14V26H6Z" fill="#8E3A1A"></path>
</svg>
</div>
<div class="absolute bottom-1 right-2 w-8 h-8 rounded-xl bg-espresso-800 text-white flex items-center justify-center shadow-md">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M3 3l18 18M9.878 9.878A3 3 0 0012 15h6a3 3 0 002.824-2.008M6.02 6.02A6.002 6.002 0 003 11a6 6 0 006 6h1" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Headline & Subtitle -->
<h1 class="font-serif text-2xl font-bold text-espresso-900 mt-2 tracking-tight">
        Sync is offline
      </h1>
<p class="text-sm text-espresso-500 mt-2 max-w-xs leading-relaxed font-normal">
<span class="font-semibold text-espresso-800">learner@example.com</span> is connected, but we couldn't reach the sync server.
      </p>
<!-- Informational Alert Container -->
<div class="w-full mt-5 p-4 rounded-2xl bg-parchment-100 border border-parchment-200 text-left flex items-start gap-3">
<div class="w-7 h-7 rounded-full bg-parchment-200 flex-shrink-0 flex items-center justify-center text-espresso-700 mt-0.5">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<p class="text-xs text-espresso-700 leading-relaxed">
          Your progress is saving locally. Automatic sync will resume as soon as an internet connection is re-established.
        </p>
</div>
<!-- Action Buttons -->
<div class="w-full mt-5 space-y-3">
<!-- Primary: Retry sync now -->
<button class="w-full h-12 px-4 rounded-xl bg-terracotta-500 hover:bg-terracotta-600 text-white font-semibold active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-sm text-sm">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Retry sync now</span>
</button>
<!-- Secondary: Continue practising offline -->
<button class="w-full h-12 px-4 rounded-xl bg-white border border-parchment-300 hover:bg-parchment-50 text-espresso-900 font-semibold active:scale-[0.99] transition-all flex items-center justify-center gap-2 text-sm shadow-[0_2px_4px_rgba(35,30,24,0.03)]">
<span>Continue practising offline</span>
</button>
</div>
</div>
<!-- Destructive / Sign out section -->
<div class="text-center pt-4 border-t border-parchment-200">
<button class="text-sm font-medium text-espresso-700 hover:text-espresso-900 underline underline-offset-4 decoration-parchment-300 transition-colors">
        Sign out
      </button>
<p class="text-xs text-espresso-400 mt-1">
        Signing out keeps your progress safely on this device.
      </p>
</div></div>
</div>

</body></html>
