<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Sign in &amp; sync - Connecting - Loro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          terracotta: {
            50: '#FDF7F4',
            100: '#F9EBE5',
            500: '#C85A32',
            600: '#B04B26',
            700: '#8E3A1A',
          },
          parchment: {
            50: '#FCFBF8',
            100: '#F7F4EC',
            200: '#EFE9DE',
            300: '#E3DCce',
          },
          espresso: {
            900: '#231E18',
            800: '#3A3229',
            700: '#52483C',
            500: '#7F7261',
            400: '#A49683',
          }
        },
        fontFamily: {
          serif: ['Newsreader', 'Georgia', 'serif'],
          sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  body {
    background-color: #ECE7DE;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #231E18;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .app-frame {
    width: 390px;
    height: 844px;
    background: #FCFBF8;
    box-shadow: 0 25px 50px -12px rgba(35, 30, 24, 0.15), 0 0 0 1px rgba(35, 30, 24, 0.05);
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
</style>
</head>
<body>

<div class="app-frame">
  <!-- Status Bar Safe Area -->
  <div class="pt-3 px-7 flex justify-between items-center text-xs font-semibold tracking-tight text-espresso-800 z-20">
    <span>9:41</span>
    <div class="w-28 h-4 bg-espresso-900 rounded-full mx-auto"></div>
    <div class="flex items-center gap-1.5">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.58 10.56 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9z"></path></svg>
      <div class="w-5 h-2.5 border border-espresso-800 rounded-sm p-0.5 flex items-center">
        <div class="h-full w-3 bg-espresso-800 rounded-2xs"></div>
      </div>
    </div>
  </div>

  <!-- Header Nav -->
  <div class="px-6 pt-4 pb-3 border-b border-parchment-200 flex items-center justify-between">
    <button class="text-espresso-400 text-sm font-semibold tracking-tight flex items-center gap-1 cursor-not-allowed">
      <span>Today</span>
    </button>
    <div class="flex items-center gap-1">
      <span class="font-serif text-lg font-semibold tracking-tight text-espresso-900">Sign in &amp; sync</span>
    </div>
    <div class="w-10"></div>
  </div>

  <!-- Content Body -->
  <div class="flex-1 px-6 pt-6 pb-8 flex flex-col justify-between overflow-y-auto">
    <div class="flex flex-col items-center text-center">
      
      <!-- Brand Emblem / Illustration -->
      <div class="relative w-28 h-28 my-3 flex items-center justify-center">
        <div class="absolute inset-0 rounded-full border-2 border-dashed border-terracotta-500/30 animate-[spin_8s_linear_infinite]"></div>
        <div class="w-20 h-20 rounded-2xl bg-parchment-100 border border-parchment-200 shadow-sm flex items-center justify-center -rotate-3 transform">
          <svg width="34" height="34" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 18C6 11.3726 11.3726 6 18 6H26V14C26 20.6274 20.6274 26 14 26H6V18Z" fill="#C85A32"></path>
            <circle cx="18" cy="14" r="3" fill="#FCFBF8"></circle>
            <path d="M6 26C6 22.6863 8.68629 20 12 20H14V26H6Z" fill="#8E3A1A"></path>
          </svg>
        </div>
        <div class="absolute bottom-1 right-2 w-8 h-8 rounded-xl bg-terracotta-500 text-white flex items-center justify-center shadow-md animate-pulse">
          <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg>
        </div>
      </div>

      <!-- Heading -->
      <h1 class="font-serif text-2xl font-bold text-espresso-900 mt-2 tracking-tight">
        Connecting to account
      </h1>
      <p class="text-sm text-espresso-500 mt-2 max-w-xs leading-relaxed font-normal">
        Authorizing in the secure authentication sheet...
      </p>

      <!-- Auth Actions Stack (Busy / Connecting state) -->
      <div class="w-full mt-7 space-y-3">
        <!-- Active Connecting Button -->
        <div class="w-full h-12 px-4 rounded-xl bg-parchment-100 border-2 border-terracotta-500 flex items-center justify-center gap-3 shadow-inner">
          <svg class="w-4 h-4 animate-spin text-terracotta-600" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span class="text-sm font-semibold text-terracotta-700">Connecting to Google…</span>
        </div>

        <!-- Disabled Apple -->
        <button disabled="" class="w-full h-12 px-4 rounded-xl bg-parchment-100 border border-parchment-200 text-espresso-400 cursor-not-allowed flex items-center justify-center gap-3 opacity-50">
          <svg class="w-4 h-4 fill-current mb-0.5" viewBox="0 0 170 170"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.66-7.79-11.88-14.24-5.37-8.22-9.69-17.51-12.97-27.87-3.28-10.36-4.92-20.3-4.92-29.82 0-13.1 3.41-24.16 10.23-33.19 6.82-9.03 15.54-13.67 26.16-13.92 4.17 0 9.07 1.13 14.7 3.38 5.63 2.25 9.47 3.45 11.53 3.6 2.06.15 6.01-1.22 11.86-4.11 5.85-2.89 10.9-4.22 15.15-4 13.91.73 24.89 5.86 32.94 15.39-12.28 7.42-18.3 17.52-18.06 30.31.24 10.15 4.14 18.66 11.71 25.53 7.57 6.87 16.63 10.74 27.18 11.61-2.22 6.53-4.78 12.78-7.68 18.75z"></path></svg>
          <span class="text-sm font-semibold">Continue with Apple</span>
        </button>

        <!-- Disabled Email -->
        <button disabled="" class="w-full h-12 px-4 rounded-xl bg-parchment-100 border border-parchment-200 text-espresso-400 cursor-not-allowed flex items-center justify-center gap-3 opacity-50">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          <span class="text-sm font-semibold">Continue with email</span>
        </button>
      </div>

      <!-- Connecting status card & Cancel action -->
      <div class="w-full mt-5 p-4 rounded-2xl bg-parchment-100 border border-parchment-200 text-left flex flex-col gap-3">
        <div class="flex items-center gap-3">
          <div class="w-2.5 h-2.5 rounded-full bg-terracotta-500 animate-ping"></div>
          <span class="text-xs font-medium text-espresso-700">Complete sign-in in the browser window.</span>
        </div>
        <button class="w-full h-10 rounded-lg bg-white border border-parchment-300 hover:bg-parchment-50 active:scale-[0.99] text-xs font-semibold text-espresso-800 transition-all shadow-sm">
          Cancel sign-in
        </button>
      </div>

    </div>

    <!-- Bottom Guest Dismiss -->
    <div class="text-center pt-4 border-t border-parchment-200">
      <button class="text-sm font-medium text-espresso-500 hover:text-espresso-700 transition-colors">
        Keep practising without an account
      </button>
      <p class="text-xs text-espresso-400 mt-1">
        Your progress stays safely stored on this device.
      </p>
    </div>
  </div>
</div>


</body></html>
