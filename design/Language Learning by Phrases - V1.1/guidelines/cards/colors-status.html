<!-- @dsCard group="Colors" viewport="700x150" subtitle="Green = progress, red = correction, amber = teaching" name="Status" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--text-primary);padding:18px 20px;box-sizing:border-box;height:150px;overflow:hidden;}
  .row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:5px;width:96px;}
  .chip{height:44px;border-radius:var(--r-card);border:1px solid rgba(35,32,27,.08);}
  .nm{font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.02em;}
  .hex{font-size:9.5px;font-weight:700;color:var(--ink-7);font-variant-numeric:tabular-nums;text-transform:uppercase;}
  .cap{font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:var(--track-caps);}
  
</style></head>
<body><div class="row">
  <div class="sw"><div class="chip" style="background:var(--grow);"></div><div class="nm">grow</div><div class="hex">#356B4F</div></div>
  <div class="sw"><div class="chip" style="background:var(--grow-surface);"></div><div class="nm">grow surf</div><div class="hex">#F1F6F2</div></div>
  <div class="sw"><div class="chip" style="background:var(--alert);"></div><div class="nm">alert</div><div class="hex">#A94A2B</div></div>
  <div class="sw"><div class="chip" style="background:var(--alert-surface);"></div><div class="nm">alert surf</div><div class="hex">#F8E9E3</div></div>
  <div class="sw"><div class="chip" style="background:var(--note-ink);"></div><div class="nm">note ink</div><div class="hex">#7A6247</div></div>
  <div class="sw"><div class="chip" style="background:var(--note-surface);"></div><div class="nm">note surf</div><div class="hex">#FAF1E7</div></div>
  <div class="sw"><div class="chip" style="background:var(--gold);"></div><div class="nm">gold</div><div class="hex">#8A6414</div></div>
</div></body></html>
