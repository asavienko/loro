<!-- @dsCard group="Brand" viewport="700x150" subtitle="No logo file exists — the name is set in plain type" name="Wordmark" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--text-primary);padding:18px 20px;box-sizing:border-box;height:150px;overflow:hidden;}
  .row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:5px;width:96px;}
  .chip{height:44px;border-radius:var(--r-card);border:1px solid rgba(35,32,27,.08);}
  .nm{font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.02em;}
  .hex{font-size:9.5px;font-weight:700;color:var(--ink-7);font-variant-numeric:tabular-nums;text-transform:uppercase;}
  .cap{font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:var(--track-caps);}
  
</style></head>
<body><div style="display:flex;align-items:center;gap:26px;">
  <span style="font-size:24px;font-weight:700;letter-spacing:-0.02em;color:var(--ink-1);">Loro</span>
  <div style="width:40px;height:40px;border-radius:50%;background:var(--ink-1);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:20px;color:var(--paper-screen);">L</div>
  <div style="font-size:11px;color:var(--ink-4);line-height:1.55;max-width:330px;">The source screens contain no logo asset. Where a mark is needed, set <b>Loro</b> in Plus Jakarta Sans 700 at -0.02em, or use the serif <b>L</b> avatar. Do not draw a parrot.</div>
</div></body></html>
