<!-- @dsCard group="Colors" viewport="700x150" subtitle="Ten warm greys; small text goes lighter, never bluer" name="Ink ramp" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--text-primary);padding:18px 20px;box-sizing:border-box;height:150px;overflow:hidden;}
  .row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:5px;width:96px;}
  .chip{height:44px;border-radius:var(--r-card);border:1px solid rgba(35,32,27,.08);}
  .nm{font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.02em;}
  .hex{font-size:9.5px;font-weight:700;color:var(--ink-7);font-variant-numeric:tabular-nums;text-transform:uppercase;}
  .cap{font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:var(--track-caps);}
  
</style></head>
<body><div class="row">
  <div class="sw"><div class="chip" style="background:var(--ink-1);"></div><div class="nm">ink-1</div><div class="hex">#23201B</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-2);"></div><div class="nm">ink-2</div><div class="hex">#514E44</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-3);"></div><div class="nm">ink-3</div><div class="hex">#5C584C</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-4);"></div><div class="nm">ink-4</div><div class="hex">#6C6759</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-6);"></div><div class="nm">ink-6</div><div class="hex">#8A8474</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-7);"></div><div class="nm">ink-7</div><div class="hex">#9A9384</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-9);"></div><div class="nm">ink-9</div><div class="hex">#B5ADA0</div></div>
</div></body></html>
