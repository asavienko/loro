<!-- @dsCard group="Brand" viewport="700x190" subtitle="Only the phone has a shadow; in-app depth is a hairline" name="Elevation" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--text-primary);padding:18px 20px;box-sizing:border-box;height:190px;overflow:hidden;}
  .row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:5px;width:96px;}
  .chip{height:44px;border-radius:var(--r-card);border:1px solid rgba(35,32,27,.08);}
  .nm{font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.02em;}
  .hex{font-size:9.5px;font-weight:700;color:var(--ink-7);font-variant-numeric:tabular-nums;text-transform:uppercase;}
  .cap{font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:var(--track-caps);}
  
</style></head>
<body><div style="display:flex;gap:20px;align-items:center;">
  <div style="width:120px;height:120px;background:var(--paper-device);border-radius:24px;box-shadow:var(--shadow-device);"></div>
  <div style="display:flex;flex-direction:column;gap:9px;">
    <div style="background:#23201b;color:var(--ink-on-dark);font-size:12px;font-weight:700;padding:10px 15px;border-radius:14px;box-shadow:var(--shadow-toast);width:max-content;">Saved to your stream</div>
    <div style="background:#fff;border:1px solid var(--line-card);border-radius:12px;padding:11px 13px;font-size:12px;color:var(--ink-2);width:max-content;">Card = 1px hairline, no shadow</div>
    <div style="font-size:10.5px;color:var(--ink-7);">--shadow-device · --shadow-toast · --shadow-lift (mic only)</div>
  </div>
</div></body></html>
