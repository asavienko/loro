<!-- @dsCard group="Type" viewport="700x240" subtitle="Everything else; 600 for text, 700 for anything small" name="Plus Jakarta Sans" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--text-primary);padding:18px 20px;box-sizing:border-box;height:240px;overflow:hidden;}
  .row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:5px;width:96px;}
  .chip{height:44px;border-radius:var(--r-card);border:1px solid rgba(35,32,27,.08);}
  .nm{font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.02em;}
  .hex{font-size:9.5px;font-weight:700;color:var(--ink-7);font-variant-numeric:tabular-nums;text-transform:uppercase;}
  .cap{font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:var(--track-caps);}
  
</style></head>
<body><div style="display:flex;flex-direction:column;gap:9px;">
  <div style="font-size:40px;font-weight:600;letter-spacing:-0.032em;line-height:1.06;">Talk first.</div>
  <div style="font-size:22px;font-weight:600;letter-spacing:var(--track-display);">Phase title · 22/600</div>
  <div style="font-size:16px;font-weight:600;letter-spacing:var(--track-tight);">Spanish in the chat · 16/600</div>
  <div style="font-size:13px;color:var(--ink-2);line-height:var(--lh-relaxed);">Canvas body copy · 13/400 at 1.55 — the workhorse for every explanatory card.</div>
  <div style="font-size:11px;font-weight:700;color:var(--ink-4);">Inline action · 11/700</div>
</div></body></html>
