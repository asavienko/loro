<!-- @dsCard group="Spacing" viewport="700x210" subtitle="344×732 device, 16–18px gutters, 40px minimum tap target" name="Screen geometry" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--text-primary);padding:18px 20px;box-sizing:border-box;height:210px;overflow:hidden;}
  .row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:5px;width:96px;}
  .chip{height:44px;border-radius:var(--r-card);border:1px solid rgba(35,32,27,.08);}
  .nm{font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.02em;}
  .hex{font-size:9.5px;font-weight:700;color:var(--ink-7);font-variant-numeric:tabular-nums;text-transform:uppercase;}
  .cap{font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:var(--track-caps);}
  
</style></head>
<body><div style="display:flex;gap:22px;align-items:center;">
  <div style="width:104px;height:170px;background:var(--paper-device);border-radius:16px;padding:3px;flex:none;">
    <div style="width:100%;height:100%;background:var(--paper-screen-quiet);border-radius:13px;display:flex;flex-direction:column;">
      <div style="height:12px;"></div>
      <div style="flex:1;border-left:1px dashed rgba(191,87,34,.45);border-right:1px dashed rgba(191,87,34,.45);margin:0 6px;"></div>
      <div style="height:20px;border-top:1px solid var(--line-hair);"></div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:7px;font-size:11px;color:var(--ink-4);">
    <div><b style="color:var(--ink-1);">--device-w / -h</b> &nbsp;344 × 732</div>
    <div><b style="color:var(--ink-1);">--screen-gutter</b> &nbsp;16px (18px in chat)</div>
    <div><b style="color:var(--ink-1);">--status-bar-h</b> &nbsp;34px</div>
    <div><b style="color:var(--ink-1);">--hit-min</b> &nbsp;40px · primary 44px · mic 56px</div>
    <div><b style="color:var(--ink-1);">--rail-gap</b> &nbsp;28px between blueprint units</div>
  </div>
</div></body></html>
