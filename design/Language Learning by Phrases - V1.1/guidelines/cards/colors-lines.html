<!-- @dsCard group="Colors" viewport="700x150" subtitle="Five weights of the same idea — 1px, warm, never grey-blue" name="Hairlines" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--text-primary);padding:18px 20px;box-sizing:border-box;height:150px;overflow:hidden;}
  .row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:5px;width:96px;}
  .chip{height:44px;border-radius:var(--r-card);border:1px solid rgba(35,32,27,.08);}
  .nm{font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.02em;}
  .hex{font-size:9.5px;font-weight:700;color:var(--ink-7);font-variant-numeric:tabular-nums;text-transform:uppercase;}
  .cap{font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:var(--track-caps);}
  
</style></head>
<body><div style="display:flex;flex-direction:column;gap:11px;">
  <div style="display:flex;align-items:center;gap:12px;"><div style="width:220px;height:1px;background:var(--line-rule);"></div><span class="nm" style="width:96px;">line-rule</span><span class="hex" style="width:70px;">#D9D3C5</span><span style="font-size:10.5px;color:var(--ink-7);">canvas section rule</span></div><div style="display:flex;align-items:center;gap:12px;"><div style="width:220px;height:1px;background:var(--line-rule-2);"></div><span class="nm" style="width:96px;">line-rule-2</span><span class="hex" style="width:70px;">#CBC4B5</span><span style="font-size:10.5px;color:var(--ink-7);">rail label underline</span></div><div style="display:flex;align-items:center;gap:12px;"><div style="width:220px;height:1px;background:var(--line-field);"></div><span class="nm" style="width:96px;">line-field</span><span class="hex" style="width:70px;">#DED7C8</span><span style="font-size:10.5px;color:var(--ink-7);">input underline</span></div><div style="display:flex;align-items:center;gap:12px;"><div style="width:220px;height:1px;background:var(--line-card);"></div><span class="nm" style="width:96px;">line-card</span><span class="hex" style="width:70px;">#E5DFD2</span><span style="font-size:10.5px;color:var(--ink-7);">card border</span></div><div style="display:flex;align-items:center;gap:12px;"><div style="width:220px;height:1px;background:var(--line-hair);"></div><span class="nm" style="width:96px;">line-hair</span><span class="hex" style="width:70px;">#ECE7DB</span><span style="font-size:10.5px;color:var(--ink-7);">in-app list divider</span></div>
</div></body></html>
