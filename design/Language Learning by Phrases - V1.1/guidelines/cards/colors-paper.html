<!-- @dsCard group="Colors" viewport="700x150" subtitle="Warm printed grounds — white is a card, never a page" name="Paper" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--text-primary);padding:18px 20px;box-sizing:border-box;height:150px;overflow:hidden;}
  .row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:5px;width:96px;}
  .chip{height:44px;border-radius:var(--r-card);border:1px solid rgba(35,32,27,.08);}
  .nm{font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.02em;}
  .hex{font-size:9.5px;font-weight:700;color:var(--ink-7);font-variant-numeric:tabular-nums;text-transform:uppercase;}
  .cap{font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:var(--track-caps);}
  
</style></head>
<body><div class="row">
  <div class="sw"><div class="chip" style="background:var(--paper-canvas);"></div><div class="nm">canvas</div><div class="hex">#EAE6DE</div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-screen);"></div><div class="nm">screen</div><div class="hex">#F6F2EA</div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-screen-quiet);"></div><div class="nm">chat</div><div class="hex">#FBF9F4</div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-raised);"></div><div class="nm">card</div><div class="hex">#FFFFFF</div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-well);"></div><div class="nm">well</div><div class="hex">#ECE7DB</div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-device);"></div><div class="nm">device</div><div class="hex">#1A1815</div></div>
</div></body></html>
