<!-- @dsCard group="Type" viewport="700x150" subtitle="Three trackings: .04em inline, .13em in-app, .16em on the canvas" name="Caps labels" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--text-primary);padding:18px 20px;box-sizing:border-box;height:150px;overflow:hidden;}
  .row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:5px;width:96px;}
  .chip{height:44px;border-radius:var(--r-card);border:1px solid rgba(35,32,27,.08);}
  .nm{font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.02em;}
  .hex{font-size:9.5px;font-weight:700;color:var(--ink-7);font-variant-numeric:tabular-nums;text-transform:uppercase;}
  .cap{font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:var(--track-caps);}
  
</style></head>
<body><div style="display:flex;flex-direction:column;gap:13px;">
  <span style="font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:.13em;">Kept from this chat &nbsp;— 9px / .13em, in-app section</span>
  <span style="font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.16em;border-bottom:1px solid var(--line-rule-2);padding-bottom:6px;">THE CONVERSATION &nbsp;— 11px / .16em, blueprint rail label</span>
  <span style="font-size:9px;font-weight:700;color:var(--ink-8);text-transform:uppercase;letter-spacing:.04em;">Agreement &nbsp;— 9px / .04em, tag inside a row</span>
</div></body></html>
