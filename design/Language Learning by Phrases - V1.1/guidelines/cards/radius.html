<!-- @dsCard group="Spacing" viewport="700x190" subtitle="12px is the default; bubbles clip one corner toward the speaker" name="Radii" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--text-primary);padding:18px 20px;box-sizing:border-box;height:190px;overflow:hidden;}
  .row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:5px;width:96px;}
  .chip{height:44px;border-radius:var(--r-card);border:1px solid rgba(35,32,27,.08);}
  .nm{font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.02em;}
  .hex{font-size:9.5px;font-weight:700;color:var(--ink-7);font-variant-numeric:tabular-nums;text-transform:uppercase;}
  .cap{font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:var(--track-caps);}
  
</style></head>
<body><div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;">
  <div style="display:flex;flex-direction:column;gap:5px;align-items:center;"><div style="width:62px;height:52px;background:#fff;border:1px solid var(--line-card);border-radius:2px;"></div><span class="nm">pip</span><span class="hex">2px</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center;"><div style="width:62px;height:52px;background:#fff;border:1px solid var(--line-card);border-radius:8px;"></div><span class="nm">tag</span><span class="hex">8px</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center;"><div style="width:62px;height:52px;background:#fff;border:1px solid var(--line-card);border-radius:12px;"></div><span class="nm">card</span><span class="hex">12px</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center;"><div style="width:62px;height:52px;background:#fff;border:1px solid var(--line-card);border-radius:16px;"></div><span class="nm">card-lg</span><span class="hex">16px</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center;"><div style="width:62px;height:52px;background:#fff;border:1px solid var(--line-card);border-radius:20px;"></div><span class="nm">pill</span><span class="hex">20px</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center;"><div style="width:62px;height:52px;background:#fff;border:1px solid var(--line-card);border-radius:26px;"></div><span class="nm">sheet</span><span class="hex">26px</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center;"><div style="width:62px;height:52px;background:#fff;border:1px solid var(--line-card);border-radius:38px;"></div><span class="nm">screen</span><span class="hex">38px</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center;"><div style="width:62px;height:52px;background:#fff;border:1px solid var(--line-card);border-radius:46px;"></div><span class="nm">device</span><span class="hex">46px</span></div>
  <div style="display:flex;flex-direction:column;gap:5px;align-items:center;"><div style="width:74px;height:52px;background:var(--accent-tint);border-radius:18px 18px 6px 18px;"></div><span class="nm">bubble-me</span><span class="hex">18/6</span></div>
</div></body></html>
