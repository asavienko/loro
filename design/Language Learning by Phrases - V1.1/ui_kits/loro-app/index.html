<!-- @dsCard group="Loro app" viewport="700x560" subtitle="The live conversation loop — chat, inspector and today" name="Loro app UI kit" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Loro · app UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--ink-1);padding:26px 30px 40px;box-sizing:border-box;}
  *{box-sizing:border-box;}
  input{font-family:inherit;}
  #root{display:flex;flex-direction:column;gap:18px;align-items:flex-start;}
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root">
  <div style="font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--ink-3);">LORO · APP UI KIT</div>
  <div style="font-size:22px;font-weight:600;letter-spacing:-0.024em;margin-top:4px;">The conversation loop</div>
  <div style="font-size:12.5px;color:var(--ink-7);margin-top:8px;">Loading the components…</div>
</div>
<script>
(async () => {
  const files = [
    '../../components/core/Tag.jsx',
    '../../components/core/SectionLabel.jsx',
    '../../components/core/Card.jsx',
    '../../components/core/PillButton.jsx',
    '../../components/core/InlineAction.jsx',
    '../../components/core/ListRow.jsx',
    '../../components/frames/StatusBar.jsx',
    '../../components/frames/PhoneFrame.jsx',
    '../../components/chat/MessageBubble.jsx',
    '../../components/chat/PhraseRow.jsx',
    '../../components/chat/DiffRow.jsx',
    '../../components/chat/MicButton.jsx',
    '../../components/chat/BottomSheet.jsx',
    '../../components/chat/Toast.jsx',
    '../../components/progress/LadderPips.jsx',
    '../../components/progress/MeterBar.jsx',
    '../../components/progress/StatFigure.jsx',
    'ChatScreen.jsx',
    'InspectorScreen.jsx',
    'TodayScreen.jsx',
    'App.jsx',
  ];
  const sources = await Promise.all(files.map(f => fetch(f).then(r => r.text())));
  for (const raw of sources) {
    const src = raw.replace(/^\s*import[^\n]*\n/gm, '').replace(/^export /gm, '');
    const code = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    const s = document.createElement('script');
    s.textContent = code;
    document.head.appendChild(s);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>
</body>
</html>
