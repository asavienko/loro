<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--ink-1);padding:18px 20px;box-sizing:border-box;height:210px;overflow:hidden;}
  .cap{font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:var(--track-caps);}
  .pill{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:var(--r-pill-lg);font-size:13px;font-weight:700;border:none;font-family:inherit;}
  .act{font-size:11px;font-weight:700;}
  .tag{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:var(--r-chip);}
  .card{background:#fff;border:1px solid var(--line-card);border-radius:var(--r-card);padding:11px 13px;font-size:12px;}
</style></head>
<body><div style="display:flex;gap:34px;align-items:flex-start;">
  <div style="display:flex;flex-direction:column;gap:11px;width:250px;">
    <div style="display:flex;align-items:center;gap:8px;"><div style="display:flex;gap:3px;"><div style="width:14px;height:5px;border-radius:2px;background:var(--accent);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--line-card);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--line-card);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--line-card);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--line-card);"></div></div><span style="font-size:10px;font-weight:700;color:var(--ink-4);">Seen</span></div><div style="display:flex;align-items:center;gap:8px;"><div style="display:flex;gap:3px;"><div style="width:14px;height:5px;border-radius:2px;background:var(--accent);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--accent);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--line-card);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--line-card);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--line-card);"></div></div><span style="font-size:10px;font-weight:700;color:var(--ink-4);">Shaky</span></div><div style="display:flex;align-items:center;gap:8px;"><div style="display:flex;gap:3px;"><div style="width:14px;height:5px;border-radius:2px;background:var(--accent);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--accent);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--accent);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--line-card);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--line-card);"></div></div><span style="font-size:10px;font-weight:700;color:var(--ink-4);">Getting it</span></div><div style="display:flex;align-items:center;gap:8px;"><div style="display:flex;gap:3px;"><div style="width:14px;height:5px;border-radius:2px;background:var(--accent);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--accent);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--accent);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--accent);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--line-card);"></div></div><span style="font-size:10px;font-weight:700;color:var(--ink-4);">Solid</span></div><div style="display:flex;align-items:center;gap:8px;"><div style="display:flex;gap:3px;"><div style="width:14px;height:5px;border-radius:2px;background:var(--grow);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--grow);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--grow);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--grow);"></div><div style="width:14px;height:5px;border-radius:2px;background:var(--grow);"></div></div><span style="font-size:10px;font-weight:700;color:var(--grow);">Owned</span></div>
  </div>
  <div style="display:flex;gap:26px;align-items:flex-start;">
    <div><div style="font-size:40px;font-weight:600;letter-spacing:-0.024em;font-variant-numeric:tabular-nums;line-height:1.05;">128</div><div style="font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.13em;margin-top:3px;">PHRASES OWNED</div></div>
    <div><div style="font-size:24px;font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;">14</div><div style="font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.13em;margin-top:3px;">DAY STREAK</div></div>
  </div>
  <div style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:10px;">
    <div><div style="display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--ink-4);margin-bottom:4px;"><span>Solid or better</span><span>64%</span></div><div style="height:5px;border-radius:2px;background:var(--line-card);overflow:hidden;"><div style="width:64%;height:100%;border-radius:2px;background:var(--grow);"></div></div></div><div><div style="display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--ink-4);margin-bottom:4px;"><span>Needs a refresh</span><span>22%</span></div><div style="height:5px;border-radius:2px;background:var(--line-card);overflow:hidden;"><div style="width:22%;height:100%;border-radius:2px;background:var(--accent);"></div></div></div><div><div style="display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--ink-4);margin-bottom:4px;"><span>Today</span><span>85%</span></div><div style="height:5px;border-radius:2px;background:var(--line-card);overflow:hidden;"><div style="width:85%;height:100%;border-radius:2px;background:var(--ink-1);"></div></div></div>
  </div>
</div></body></html>
