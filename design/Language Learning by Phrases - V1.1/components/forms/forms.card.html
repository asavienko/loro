<!-- @dsCard group="Components" viewport="700x330" subtitle="SearchField · TextArea · SegmentedTabs · ChoiceCard · StepDots" name="Forms" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--ink-1);padding:18px 20px;box-sizing:border-box;height:330px;overflow:hidden;}
  .cap{font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:var(--track-caps);}
  input,textarea{font-family:inherit;}
</style></head>
<body><div style="display:flex;gap:28px;">
  <div style="width:330px;display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--accent);border-radius:16px;padding:11px 13px;">
      <span style="flex:1;font-size:14px;font-weight:600;color:var(--ink-1);">un cortado</span>
      <span style="font-size:15px;color:var(--ink-4);">✕</span>
    </div>
    <div style="display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--line-card);border-radius:16px;padding:11px 13px;">
      <span style="flex:1;font-size:14px;font-weight:600;color:var(--ink-9);">Type a phrase, or a topic…</span>
    </div>
    <div style="border:1px solid var(--line-card);border-radius:12px;padding:11px 12px;background:#fff;font-size:13px;font-weight:600;line-height:1.5;color:var(--ink-9);height:74px;">Una caña, por favor — A beer, please<br>¿Tienen tapas?</div>
    <div style="display:flex;gap:7px;">
      <div style="display:flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:20px;background:var(--ink-1);"><span style="font-size:11.5px;font-weight:700;color:var(--paper-screen);">Discover</span></div>
      <div style="display:flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line-field);"><span style="font-size:11.5px;font-weight:700;color:var(--ink-3);">Browse</span></div>
      <div style="display:flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line-field);"><span style="font-size:11.5px;font-weight:700;color:var(--ink-3);">Import</span></div>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;gap:12px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:28px;text-align:center;font-size:15px;color:var(--ink-4);">‹</span>
      <div style="flex:1;display:flex;gap:4px;">
        <div style="flex:1;height:3px;border-radius:2px;background:var(--accent);"></div>
        <div style="flex:1;height:3px;border-radius:2px;background:var(--accent);"></div>
        <div style="flex:1;height:3px;border-radius:2px;background:var(--line-card);"></div>
        <div style="flex:1;height:3px;border-radius:2px;background:var(--line-card);"></div>
      </div>
      <span style="font-size:10.5px;font-weight:700;color:var(--ink-7);">2/4</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;background:var(--accent-tint);border:1.5px solid var(--accent);border-radius:16px;padding:13px 14px;">
      <div style="flex:1;"><div style="font-size:14px;font-weight:700;">Fairly confident</div><div style="font-size:11.5px;color:var(--ink-4);margin-top:2px;">I can hold a chat</div></div>
      <span style="width:20px;text-align:center;font-size:14px;font-weight:700;color:var(--accent-ink);">✓</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line-card);border-radius:16px;padding:13px 14px;">
      <div style="flex:1;"><div style="font-size:14px;font-weight:700;">Some basics</div><div style="font-size:11.5px;color:var(--ink-4);margin-top:2px;">I know a few things</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line-card);border-radius:16px;padding:13px 14px;">
      <div style="flex:1;"><div style="font-size:14px;font-weight:700;">Starting out</div><div style="font-size:11.5px;color:var(--ink-4);margin-top:2px;">Little to none</div></div>
    </div>
    <div class="cap">Selected = accent tint + accent border + tick</div>
  </div>
</div></body></html>
