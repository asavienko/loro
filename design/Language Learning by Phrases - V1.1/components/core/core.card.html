<!-- @dsCard group="Components" viewport="700x330" subtitle="SectionLabel · Card · PillButton · InlineAction · Tag · ListRow" name="Core" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;}
  body{background:var(--paper-canvas);font-family:var(--font-sans);color:var(--ink-1);padding:18px 20px;box-sizing:border-box;height:330px;overflow:hidden;}
  .cap{font-size:9px;font-weight:700;color:var(--ink-7);text-transform:uppercase;letter-spacing:var(--track-caps);}
  .pill{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:var(--r-pill-lg);font-size:13px;font-weight:700;border:none;font-family:inherit;}
  .act{font-size:11px;font-weight:700;}
  .tag{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:var(--r-chip);}
  .card{background:#fff;border:1px solid var(--line-card);border-radius:var(--r-card);padding:11px 13px;font-size:12px;}
</style></head>
<body><div style="display:flex;gap:30px;">
  <div style="width:300px;display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div class="cap">Kept from this chat</div>
      <span style="font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.16em;border-bottom:1px solid var(--line-rule-2);padding-bottom:6px;">THE CONVERSATION</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="pill" style="background:var(--accent);color:#fff;">Use it &amp; keep the fix</button>
      <button class="pill" style="background:var(--grow);color:#fff;">Save the fix</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="pill" style="background:#fff;border:1px solid var(--line-soft);color:var(--ink-2);">Again</button>
      <button class="pill" style="background:var(--paper-well);color:var(--ink-2);">Skip</button>
      <button class="pill" style="background:var(--ink-1);color:var(--paper-screen);">Done</button>
    </div>
    <div style="display:flex;gap:13px;align-items:center;">
      <span class="act" style="color:var(--ink-4);">♪ Hear</span>
      <span class="act" style="color:var(--ink-4);">EN</span>
      <span class="act" style="color:var(--grow-soft);">Saved</span>
      <span class="act" style="color:var(--accent-ink);">Fix 2 ›</span>
      <span class="act" style="color:var(--alert-quiet);">Start over</span>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;gap:12px;">
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <span class="tag" style="color:var(--ink-3);background:var(--paper-well);">casual</span>
      <span class="tag" style="color:var(--accent-ink);background:var(--accent-tint);">from chat</span>
      <span class="tag" style="color:var(--grow);background:var(--grow-tint);">owned</span>
      <span class="tag" style="color:var(--alert);background:var(--alert-surface);">refresh</span>
      <span class="tag" style="color:var(--gold);background:var(--gold-surface);">trip set</span>
      <span class="tag" style="color:var(--ink-8);padding:4px 0;letter-spacing:.09em;">Agreement</span>
    </div>
    <div class="card">Card · plain — the default container</div>
    <div class="card" style="background:var(--grow-surface);border-color:var(--grow-line);color:var(--grow);">Card · grow — nothing to fix here</div>
    <div class="card" style="background:var(--note-surface);border-color:var(--note-line);color:var(--note-ink);">Card · note — why it's said this way</div>
    <div>
      <div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line-hair);"><span style="flex:1;font-size:14px;font-weight:600;">Morning talk</span><span style="color:var(--accent-ink);font-weight:700;">·</span></div>
      <div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line-hair);"><span style="flex:1;font-size:14px;font-weight:600;">At the café</span></div>
      <div style="font-size:9.5px;color:var(--ink-7);padding-top:6px;">ListRow — hairlines, not cards</div>
    </div>
  </div>
</div></body></html>
