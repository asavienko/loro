# Authentication never trusts caller forwarding headers or forwards cookies.
limit_req zone=origin burst=40 nodelay;
proxy_connect_timeout 3s;
proxy_read_timeout 15s;
proxy_pass_request_headers off;
proxy_set_header Host localhost;
proxy_set_header Content-Type $content_type;
proxy_set_header Authorization $http_authorization;
proxy_set_header X-Loro-Device $http_x_loro_device;
proxy_set_header X-Loro-App $http_x_loro_app;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header Origin $http_origin;
proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
proxy_redirect off;
proxy_pass http://127.0.0.1:3000;
