# Authentication never trusts caller forwarding headers or forwards cookies. The gateway Lambda,
# the only client allowed to reach this port, names the caller's address in X-Loro-Source-IP.
proxy_connect_timeout 3s;
# API Gateway answers within 30 s; the Lambda gives up at 28 s.
proxy_read_timeout 28s;
proxy_pass_request_headers off;
proxy_set_header Host localhost;
proxy_set_header Content-Type $content_type;
proxy_set_header Authorization $http_authorization;
proxy_set_header X-Loro-Device $http_x_loro_device;
proxy_set_header X-Loro-App $http_x_loro_app;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header Range $http_range;
proxy_set_header If-None-Match $http_if_none_match;
proxy_set_header X-Real-IP $http_x_loro_source_ip;
proxy_set_header Origin $http_origin;
proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
proxy_redirect off;
proxy_pass http://127.0.0.1:3000;
