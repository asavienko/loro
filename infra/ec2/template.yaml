AWSTemplateFormatVersion: '2010-09-09'
Description: Loro restricted development API (M0 delivery)
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with an Internet Gateway route in VpcId
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  AdminCidr:
    Type: String
    Description: Your public IPv4 address with /32; SSH only
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: >-
      The instance's image. A different image replaces the instance, its disk and the database on
      it, so scripts/provision-ec2.sh passes the running instance's own image when updating and
      Amazon Linux 2023's latest only when creating the stack.
Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH only; API accessed through SSH tunnel
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref ConnectEndpointSecurityGroup
  # SSH over HTTPS, for networks that block port 22: `aws ec2-instance-connect open-tunnel` reaches
  # the instance's port 22 through this endpoint (no charge), still with the SSH key.
  ConnectEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 Instance Connect Endpoint; SSH out only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
  ConnectEndpoint:
    Type: AWS::EC2::InstanceConnectEndpoint
    Properties:
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref ConnectEndpointSecurityGroup]
      # The instance's group admits the endpoint's group, so connections must come from the endpoint.
      PreserveClientIp: false
  # The API container's AWS identity: it may only send email through SES (email sign-in codes).
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: send-email-codes
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
  ApiInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ApiRole]
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.small
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref ApiInstanceProfile
      MetadataOptions:
        HttpTokens: required
        # 2, not 1: the API runs in a container on a Docker network, one hop further from the
        # metadata service, and reads the role's credentials there. The role can only send email.
        HttpPutResponseHopLimit: 2
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-api'
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker
          systemctl enable --now docker
Outputs:
  InstanceId:
    Value: !Ref Instance
  Host:
    Value: !GetAtt Instance.PublicDnsName
